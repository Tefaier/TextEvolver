worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=per_ip_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=per_ip_login:10m rate=100r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream text_evolver_app {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 550m;

        location = /login {
            limit_req zone=per_ip_general burst=40 nodelay;
            limit_req zone=per_ip_login burst=5 nodelay;
            proxy_pass http://text_evolver_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=per_ip_general burst=40 nodelay;
            proxy_pass http://text_evolver_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
