name: text-evolver

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: 6432
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: redgate/flyway:11.15.0
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/postgresql
      FLYWAY_CONNECT_RETRIES: 20
    volumes:
      - ./migrations/sql:/flyway/sql:ro
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - user-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: text-evolver:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      PASSWORD_KEY_CURRENT: ${PASSWORD_KEY_CURRENT}
      PASSWORD_KEY_CURRENT_VERSION: ${PASSWORD_KEY_CURRENT_VERSION}
      PASSWORD_KEY_PREVIOUS: ${PASSWORD_KEY_PREVIOUS:-}
      PASSWORD_KEY_PREVIOUS_VERSION: ${PASSWORD_KEY_PREVIOUS_VERSION:-}
      WORK_ROOT: /data/work
      TEMP_ROOT: /data/tmp
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_LIMIT_BYTES: ${UPLOAD_LIMIT_BYTES:-26214400}
      SETTING_LIMIT_BYTES: ${SETTING_LIMIT_BYTES:-536870912}
      RESULTS_PER_PAGE: ${RESULTS_PER_PAGE:-50}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - work-data:/data/work
      - temp-data:/data/tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: text-evolver:local
    command: ["python", "-m", "text_evolver.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      PASSWORD_KEY_CURRENT: ${PASSWORD_KEY_CURRENT}
      PASSWORD_KEY_CURRENT_VERSION: ${PASSWORD_KEY_CURRENT_VERSION}
      PASSWORD_KEY_PREVIOUS: ${PASSWORD_KEY_PREVIOUS:-}
      PASSWORD_KEY_PREVIOUS_VERSION: ${PASSWORD_KEY_PREVIOUS_VERSION:-}
      WORK_ROOT: /data/work
      TEMP_ROOT: /data/tmp
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CHROME_BINARY: /usr/bin/chromium
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_CANCEL_POLL_SECONDS: ${WORKER_CANCEL_POLL_SECONDS:-0.5}
      WORKER_MIN_FREE_MEMORY_BYTES: ${WORKER_MIN_FREE_MEMORY_BYTES:-805306368}
      JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-300}
    volumes:
      - work-data:/data/work
      - temp-data:/data/tmp
    depends_on:
      app:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  work-data:
  temp-data:
  user-data:
