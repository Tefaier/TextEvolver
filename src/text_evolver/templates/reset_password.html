{% extends "basis.html" %}
{% block context %}
<main class="account-dialog panel">
    <h1>{{ translate('Set a new password') }}</h1>
    <form action="{{ url_for('reset_password') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="reset-password">{{ translate('New password') }}</label>
        <input id="reset-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <label for="reset-confirm">{{ translate('Repeat password') }}</label>
        <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <button class="button" type="submit">{{ translate('Reset password and sign out all sessions') }}</button>
    </form>
</main>
{% endblock %}
