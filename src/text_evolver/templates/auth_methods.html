<div class="auth-methods">
    {% if google_enabled %}
    <form action="{{ url_for('google_start') }}" method="post" data-native-submit>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="button" type="submit">{{ translate('Sign in with Google') }}</button>
    </form>
    {% endif %}
    <button class="button" type="button" data-webauthn="login">{{ translate('Sign in with a passkey') }}</button>
    <a href="{{ url_for('forgot_password') }}">{{ translate('Forgot password? Use your enrolled passkey') }}</a>
</div>
